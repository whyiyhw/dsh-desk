name: release build

# S3: full `pnpm tauri build` on tags (installers attached to the GitHub
# Release) and PRs (installers as workflow artifacts). The cheap cargo-check
# gate on every non-tag push lives in check.yml.
on:
  push:
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # S12: tauri.conf.json's version is the single source; a tag build must
      # be cut from a tree whose three version fields match the tag (a release
      # whose tag and embedded version disagree would confuse S5a checks).
      - name: Version consistency guard
        shell: bash
        run: node scripts/check-versions.mjs "$TAG_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # Separate job so the write token exists only where it is used: PR builds
  # (including forks) never see contents:write.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: bundle
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bundle/nsis/*.exe
            bundle/msi/*.msi
