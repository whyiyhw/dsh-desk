name: release build

# S3: full `pnpm tauri build` on tags (installers attached to the GitHub
# Release) and PRs (installers as workflow artifacts). The cheap cargo-check
# gate on every non-tag push lives in check.yml.
on:
  push:
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # S12: tauri.conf.json's version is the single source; a tag build must
      # be cut from a tree whose three version fields match the tag (a release
      # whose tag and embedded version disagree would confuse S5a checks).
      - name: Version consistency guard
        shell: bash
        run: node scripts/check-versions.mjs "$TAG_NAME"
      - run: pnpm install --frozen-lockfile
      # S24: tags build the updater artifacts (bundle.createUpdaterArtifacts
      # is on; the .sig files land next to the installers) and sign them with
      # the repo secret set at the Q2 decision — losing that key strands
      # every shipped client on its embedded pubkey, see AGENTS.md. PR builds
      # (including forks, which never see repo secrets) disable the updater
      # artifacts instead: the CLI hard-errors on createUpdaterArtifacts
      # without a private key, which would turn every fork PR red (review
      # finding).
      - run: pnpm tauri build
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi

  # Separate job so the write token exists only where it is used: PR builds
  # (including forks) never see contents:write.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-installers
          path: bundle
      # S7/README FAQ: publish SHA-256 of every installer so unsigned-download
      # verification is possible (certutil -hashfile <file> SHA256). Passed as
      # `body` next to generate_release_notes — the API appends the generated
      # notes after a custom body, so both end up in the release.
      - name: Compute installer checksums
        id: hash
        working-directory: bundle
        run: |
          {
            echo 'body<<HASHES_EOF'
            echo '## SHA-256 checksums'
            echo 'Verify your download: `certutil -hashfile <file> SHA256` (Windows) or `sha256sum <file>`.'
            echo
            find . -type f \( -name '*.exe' -o -name '*.msi' \) -print0 | sort -z | xargs -0 sha256sum | sed 's|\./||'
            echo 'HASHES_EOF'
          } >> "$GITHUB_OUTPUT"
      # S24: the updater manifest the in-app updater fetches (endpoints in
      # tauri.conf.json point at releases/latest/download/latest.json —
      # GitHub's "latest" excludes prereleases, so a prerelease never
      # auto-installs, by design). NSIS is the artifact the updater runs.
      - name: Build updater manifest
        working-directory: bundle
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME;
            const version = tag.replace(/^v/, "");
            const signature = fs.readFileSync(
              `nsis/dsh-desk_${version}_x64-setup.exe.sig`, "utf8").trim();
            const manifest = {
              version,
              notes: `https://github.com/whyiyhw/dsh-desk/releases/tag/${tag}`,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature,
                  url: `https://github.com/whyiyhw/dsh-desk/releases/download/${tag}/dsh-desk_${version}_x64-setup.exe`,
                },
              },
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          cat latest.json
      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.hash.outputs.body }}
          generate_release_notes: true
          files: |
            bundle/nsis/*.exe
            bundle/msi/*.msi
            bundle/latest.json
