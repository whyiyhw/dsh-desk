name: cargo check

# Phase 0 baseline CI: cheap compile gate on every push.
# Full build + installers on tag/PR is S3 (release.yml) — tags skip this one.
on:
  push:
    tags-ignore: ['v*']

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check
