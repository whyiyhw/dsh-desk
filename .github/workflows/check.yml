name: cargo check

# Phase 0 baseline CI: cheap compile gate on every push.
# Full build + installers on tag/PR is S3 (release.yml) — tags skip this one.
on:
  push:
    # branches MUST be named for branch pushes to trigger at all: a
    # tags-ignore-only filter matches tag pushes only, which silently
    # killed this gate between S3 and 2026-09-21 (zero runs on main
    # pushes). Keep both: every branch push, no v* tag (release.yml owns
    # those).
    branches: ['**']
    tags-ignore: ['v*']

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check
