<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DSH Desk</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 14px system-ui, sans-serif;
        color: #555;
        background: #f5f5f5;
      }
      .box { text-align: center; }
      .spin {
        width: 28px;
        height: 28px;
        margin: 0 auto 14px;
        border: 3px solid #d0d0d0;
        border-top-color: #666;
        border-radius: 50%;
        animation: r 0.9s linear infinite;
      }
      @keyframes r { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spin"></div>
      <div>Starting the dsh web server…</div>
    </div>
  </body>
</html>
