[package]
name = "dsh-desk"
version = "0.1.0"
description = "Desktop shell for the DeepSeek Harness web GUI"
authors = ["whyiyhw"]
edition = "2021"

[lib]
name = "dsh_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
