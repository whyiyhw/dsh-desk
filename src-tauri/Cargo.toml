[package]
name = "dsh-desk"
version = "0.3.0"
description = "Desktop shell for the DeepSeek Harness web GUI"
authors = ["whyiyhw"]
edition = "2021"

[lib]
name = "dsh_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# S23: single-instance is now an in-house per-instance guard (lib.rs
# instance_guard) — the plugin's lock identity is only the app identifier,
# arg-independent, so coexisting named instances were impossible with it.
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# S5a update check: blocking HTTP on a worker thread; default TLS is rustls.
ureq = { version = "2", features = ["json"] }
# S9 window geometry persistence (size/position/maximized; VISIBLE excluded).
tauri-plugin-window-state = "2"
# S7 tray status: system toast when the server dies unexpectedly.
tauri-plugin-notification = "2"
# S21 seamless caption: the non-client capability probe runs through the
# same webview2-com the tree already carries via tauri (Settings9 = the
# IsNonClientRegionSupportEnabled property); windows-core supplies
# Interface::cast. The fallback caption tint is a two-line dwmapi extern,
# no further crate.
webview2-com = "0.38"
windows-core = "0.61"
# S23 instance guard: named mutex + hidden message window + WM_COPYDATA.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    # CreateMutexW's signature mentions SECURITY_ATTRIBUTES
    "Win32_Security",
] }

[profile.release]
strip = true
lto = true
