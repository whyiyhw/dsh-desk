[package]
name = "dsh-desk"
version = "0.2.0"
description = "Desktop shell for the DeepSeek Harness web GUI"
authors = ["whyiyhw"]
edition = "2021"

[lib]
name = "dsh_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# S5a update check: blocking HTTP on a worker thread; default TLS is rustls.
ureq = { version = "2", features = ["json"] }
# S9 window geometry persistence (size/position/maximized; VISIBLE excluded).
tauri-plugin-window-state = "2"

[profile.release]
strip = true
lto = true
